[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmeval-vrag"
version = "0.1.0"
description = "Evaluation framework for Multimodal Vision-Language RAG systems — measure retrieval quality, hallucination, faithfulness, and cross-modal alignment in one unified pipeline."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Emmanuelle Bourigault", email = "bourigaulte98@gmail.com"},
]
keywords = [
    "multimodal", "evaluation", "RAG", "vision-language",
    "LLM", "hallucination", "VQA", "CLIP", "retrieval",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "Pillow>=9.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
torch = ["torch>=2.0", "torchvision>=0.15"]
transformers = ["transformers>=4.35", "sentence-transformers>=2.2"]
full = [
    "torch>=2.0",
    "torchvision>=0.15",
    "transformers>=4.35",
    "sentence-transformers>=2.2",
    "openai>=1.0",
    "faiss-cpu>=1.7",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
Homepage = "https://github.com/EmmanuelleB985/mmeval-vrag"
Documentation = "https://github.com/EmmanuelleB985/mmeval-vrag#readme"
Repository = "https://github.com/EmmanuelleB985/mmeval-vrag"
Issues = "https://github.com/EmmanuelleB985/mmeval-vrag/issues"

[project.scripts]
mmeval-vrag = "mmeval_vrag.cli:main"

[tool.setuptools.packages.find]
include = ["mmeval_vrag*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
